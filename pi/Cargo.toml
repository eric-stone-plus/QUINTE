[package]
name = "pi"
version = "0.1.0"
license = "Apache-2.0"
edition = "2024"
description = "Minimal A2A v1.0 review seat agent for QUINTE: one task in, one contract artifact out."

[[bin]]
name = "pi"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6", features = ["derive", "env"] }
jsonschema = "0.47"
# Blocking client, no async runtime. rustls-no-provider avoids http3/quinn
# extras; rustls supplies the process crypto provider.
reqwest = { version = "0.13", default-features = false, features = [
    "blocking",
    "rustls-no-provider",
] }
rustls = "0.23"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.22", features = ["v7", "serde"] }
